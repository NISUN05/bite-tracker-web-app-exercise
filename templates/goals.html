{% extends "base.html" %}
{% block content %}
<section class="page-card">
  <h2>Your daily goals</h2>
  <form method="post" action="{{ url_for('goals') }}" data-preview-form="goals">
    <label class="field">Display name<input name="displayName" value="{{ display_name }}" maxlength="80" required></label>
    <div class="goal-heading">{{ icon('Target', 15) }} Daily targets</div>
    <div class="goal-fields">{% for key, label in [('calories','Calories'), ('protein','Protein (g)'), ('carbs','Carbs (g)'), ('fat','Fat (g)'), ('water','Water (ml)')] %}<label class="field {{ 'wide' if key in ['calories','water'] else '' }}">{{ label }}<input name="{{ key }}" type="number" value="{{ goals[key] }}" min="{{ 500 if key == 'calories' else 0 }}" max="{{ 10000 if key in ['calories','water'] else 1000 }}" step="1" required></label>{% endfor %}</div>
    <p class="form-error" role="status" data-form-status hidden></p><button class="primary-button">Save changes</button>
  </form>
</section>
{% endblock %}
