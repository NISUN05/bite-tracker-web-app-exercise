<div class="meal-list">
  {% for meal in meals %}
  <article>
    <div class="meal-copy"><h3>{{ meal.name }}</h3><p>{{ meal.date_label }}</p></div>
    <strong>{{ meal.calories }} <small>cal</small></strong>
    <div class="meal-actions"><a href="{{ url_for('edit_meal', meal_id=meal.id) }}" aria-label="Edit {{ meal.name }}">Edit</a><a href="{{ url_for('delete_meal', meal_id=meal.id) }}" aria-label="Remove {{ meal.name }}">Remove</a></div>
  </article>
  {% else %}
  <div class="empty-log"><h3>No meals here yet</h3><p>{{ empty_message|default('Start with whatever you last ate. A rough estimate is fine.') }}</p><a class="text-link" href="{{ url_for('add_meal') }}">Add a meal</a></div>
  {% endfor %}
</div>
