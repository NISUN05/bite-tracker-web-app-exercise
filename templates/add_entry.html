<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Food</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Add Food</h1>
  <p>
  <a href="/dashboard">Main Page</a> |
  <a href="/today">Today</a> |
  <a href="/history">History</a> |
  <a href="/search">Search</a> |
  <a href="/weekly-summary">Weekly Summary</a> |
  <a href="/weekly-goal">Weekly Goal</a>
</p>

  <form method="post">
    <p>Date: <input type="date" name="date"></p>
    <p>Food name: <input type="text" name="item_name" required></p>
    <p>Meal:
      <select name="meal_category">
        {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </p>
    <p>Calories: <input type="number" step="any" min="0" name="calories" value="0"></p>
    <p>Protein (g): <input type="number" step="any" min="0" name="protein" value="0"></p>
    <p>Carbs (g): <input type="number" step="any" min="0" name="carbs" value="0"></p>
    <p>Fat (g): <input type="number" step="any" min="0" name="fat" value="0"></p>
    <button type="submit">Add</button>
  </form>
</body>
</html>
