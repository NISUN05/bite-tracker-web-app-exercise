{% extends "base.html" %}
{% block content %}
<section class="page-card">
  <h2>Update this meal</h2>
  <form method="post" action="{{ url_for('edit_meal', meal_id=meal.id) }}" data-preview-form="meal">
    {% include "_meal_fields.html" %}
    <p class="form-error" role="status" data-form-status hidden></p>
    <button class="primary-button">Save changes</button>
    <a class="secondary-link" href="{{ url_for('meals') }}">Cancel</a>
  </form>
</section>
{% endblock %}
